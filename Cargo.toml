[package]
name = "nt"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Reconnectable remote terminal with a built-in session switcher"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ansis-liepkalns/nt"
keywords = ["terminal", "ssh", "remote", "session", "mosh"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
crossterm = "0.29.0"
getrandom = "0.4.3"
lexopt = "0.3.2"
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["static-stdcxx"], optional = true }
nix = { version = "0.31.3", features = ["term", "process", "fs", "signal", "user", "socket", "net"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }
vt100 = "0.16.2"
vte = "0.15"

[features]
default = ["llm"]
llm = ["dep:llama-cpp-2"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
